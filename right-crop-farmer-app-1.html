<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ಸರಿಯಾದ ಬೆಳೆ · Right Crop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F1F5EA; --surface:#FFFFFF; --ink:#14261B; --muted:#4F6355; --line:#CFDAC6;
  --field:#1E5B3A; --field-soft:#DDEBDD; --turmeric:#E4A11B; --turmeric-soft:#F8E7BB;
  --good:#1E5B3A; --mid:#8A5A00; --bad:#B04A2A; --on-field:#FFFFFF; --bubble:#DDEFD0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A13; --surface:#16241B; --ink:#E6EEDF; --muted:#A5B8A9; --line:#2A3D30;
    --field:#5DBB86; --field-soft:#22372A; --turmeric:#F0B93E; --turmeric-soft:#4A3A12;
    --good:#7FD6A2; --mid:#F0B93E; --bad:#E8856A; --on-field:#0F1A13; --bubble:#1F3A28;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A13; --surface:#16241B; --ink:#E6EEDF; --muted:#A5B8A9; --line:#2A3D30;
  --field:#5DBB86; --field-soft:#22372A; --turmeric:#F0B93E; --turmeric-soft:#4A3A12;
  --good:#7FD6A2; --mid:#F0B93E; --bad:#E8856A; --on-field:#0F1A13; --bubble:#1F3A28;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Figtree","Noto Sans Kannada",system-ui,sans-serif;font-size:19px;line-height:1.6}
h1,h2,h3{font-family:"Bricolage Grotesque","Noto Sans Kannada",system-ui,sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--turmeric);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque","Noto Sans Kannada",sans-serif;font-weight:800;font-size:1.3rem}
.brand svg{width:34px;height:34px}
.lang{display:flex;border:2px solid var(--field);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:7px 14px;font-weight:600;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--field);color:var(--on-field)}

.progress{display:flex;align-items:center;gap:8px;margin:6px 0 18px;color:var(--muted);font-size:.9rem}
.progress .dots{display:flex;gap:6px}
.progress .dots i{width:34px;height:8px;border-radius:4px;background:var(--line)}
.progress .dots i.on{background:var(--field)}

h1.big{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:800;letter-spacing:-.01em;margin:18px 0 12px}
.lead{color:var(--muted);margin:0 0 22px}
h2.step{font-size:1.8rem;font-weight:800;margin-bottom:6px}
.q{margin:26px 0 10px;font-weight:600;font-size:1.15rem}
.hint{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{position:relative;min-height:76px;padding:12px 10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:center;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile .em{font-size:1.7rem;line-height:1.1}
.tile small{color:var(--muted);font-size:.78rem;line-height:1.3}
.tile[aria-pressed="true"]{border-color:var(--field);background:var(--field-soft);font-weight:700}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--good);font-weight:800}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:64px;height:64px;border-radius:50%;border:2px solid var(--field);background:var(--surface);font-size:2rem;line-height:1;font-weight:700;color:var(--good)}
.stepper output{min-width:110px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800}
.stepper output small{font-family:"Figtree","Noto Sans Kannada",sans-serif;font-size:1rem;font-weight:500;color:var(--muted)}

.soilrow{margin-top:20px}
.soilrow .tiles{grid-template-columns:repeat(4,1fr);gap:6px}
.soilrow .tile{min-height:56px;font-size:.88rem;padding:8px 4px}
@media (max-width:440px){.soilrow .tiles{grid-template-columns:1fr 1fr}}

.nav{display:flex;gap:12px;margin-top:34px}
.btn{flex:1;min-height:60px;border-radius:999px;border:2px solid var(--field);background:var(--surface);font-weight:700;font-size:1.1rem;padding:10px 18px}
.btn.main{background:var(--field);color:var(--on-field)}
.btn.wa{background:#25D366;border-color:#25D366;color:#073B1B;text-decoration:none;display:flex;align-items:center;justify-content:center}

/* result */
.best{background:var(--surface);border:3px solid var(--field);border-radius:24px;padding:22px;margin-top:6px}
.best .tag{color:var(--muted);font-size:.95rem;margin:0 0 4px}
.best .name{display:flex;align-items:center;gap:14px}
.best .em{font-size:3.4rem;line-height:1}
.best h2{font-size:2.5rem;font-weight:800}
.alt{color:var(--muted);font-size:.9rem;margin:0}
.match{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600}
.match i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line)}
.match i.on{background:var(--field)}
.sectitle{font-size:1.2rem;font-weight:800;margin:24px 0 10px}
.years{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.years{grid-template-columns:1fr}}
.year{border-radius:14px;padding:12px;background:var(--paper);border:1px solid var(--line)}
.year.mid{border:2px solid var(--field);background:var(--field-soft)}
.year .lb{font-size:.88rem;color:var(--muted)}
.year .qt{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:800;line-height:1.2}
.year .pf{font-size:.95rem;font-weight:600}
.profit{color:var(--good)} .loss{color:var(--bad)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rows li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:8px}
.rows li span{color:var(--muted)} .rows li b{text-align:right}
.todo{margin:0;padding-left:22px}
.todo li{margin-bottom:6px}
.other{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.other .em{font-size:1.8rem}
.other b{display:block}
.other span{font-size:.9rem;color:var(--muted)}
.actions{display:grid;gap:10px;margin-top:22px}
.note{color:var(--muted);font-size:.9rem;min-height:1.4em;margin:8px 0 0}
.fine{color:var(--muted);font-size:.82rem;margin-top:26px}
.warn{background:var(--turmeric-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.best{animation:pop .5s ease-out both}}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

 fixN_low:'ಮಣ್ಣಿಗೆ ಹೆಚ್ಚು ಶಕ್ತಿ ಬೇಕು. ತಿಪ್ಪೆ ಗೊಬ್ಬರ ಹಾಕಿ, ಯೂರಿಯಾವನ್ನು ಎರಡು ಬಾರಿ ಕೊಡಿ.',fixN_high:'ಮಣ್ಣಿನಲ್ಲಿ ಈಗಾಗಲೇ ಶಕ್ತಿ ಇದೆ. ಬಿತ್ತನೆ ವೇಳೆ ಯೂರಿಯಾ ಬೇಡ.',
 fixP_low:'ಬಿತ್ತನೆ ವೇಳೆ ಡಿಎಪಿ ಅಥವಾ ಎಸ್‌ಎಸ್‌ಪಿ ಗೊಬ್ಬರ ಹಾಕಿ.',fixP_high:'ಮಣ್ಣಿನಲ್ಲಿ ಸಾಕಷ್ಟು ಇದೆ. ಈ ಋತುವಿನಲ್ಲಿ ಡಿಎಪಿ ಬೇಡ.',
 fixK_low:'ಪೊಟ್ಯಾಶ್ ಗೊಬ್ಬರ (ಎಂಒಪಿ) ಹಾಕಿ.',fixK_high:'ಮಣ್ಣಿನಲ್ಲಿ ಸಾಕಷ್ಟು ಇದೆ. ಪೊಟ್ಯಾಶ್ ಬೇಡ.',
 fixpH_low:'ಮಣ್ಣು ಹುಳಿ (ಆಮ್ಲೀಯ). ಸುಣ್ಣ ಹಾಕಿ. ಎಷ್ಟು ಹಾಕಬೇಕೆಂದು ಕೆವಿಕೆಯಲ್ಲಿ ಕೇಳಿ.',fixpH_high:'ಮಣ್ಣು ಉಪ್ಪು (ಕ್ಷಾರೀಯ). ಜಿಪ್ಸಮ್ ಅಥವಾ ತಿಪ್ಪೆ ಗೊಬ್ಬರ ಹಾಕಿ.',
 msgHead:(a,d,c,q,p)=>`${d} ನಿಮ್ಮ ${a} ಎಕರೆಗೆ ಉತ್ತಮ ಬೆಳೆ: ${c}. ಸಾಮಾನ್ಯ ವರ್ಷದಲ್ಲಿ ಸುಮಾರು ${q} ಕ್ವಿಂಟಾಲ್ ಇಳುವರಿ ಮತ್ತು ${p}.`,
 msgOther:(x)=>`ಇತರ ಒಳ್ಳೆಯ ಆಯ್ಕೆಗಳು: ${x}.`,msgFix:f=>`ಮೊದಲು ಇದನ್ನು ಮಾಡಿ: ${f}`,
 profitWord:n=>(n>=0?'ಸುಮಾರು ₹'+Math.round(n).toLocaleString('en-IN')+' ಲಾಭ':'ಸುಮಾರು ₹'+Math.abs(Math.round(n)).toLocaleString('en-IN')+' ನಷ್ಟ')
}};

/* ---------- STATE & HELPERS ---------- */
const S = {lang:'kn',step:0,district:'mandya',season:'kharif',acres:3,rain:'normal',irrig:'no',soil:'dk'};
const $ = s => document.querySelector(s);
const t = k => T[S.lang][k];
const inr = n => (n<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const num = n => n>=10 ? Math.round(n).toLocaleString('en-IN') : (Math.round(n*10)/10).toString();
const fit = (v,lo,hi,tl,th) => v<lo ? Math.max(0,1-(lo-v)/tl) : v>hi ? Math.max(0,1-(v-hi)/th) : 1;
const tile = (key,val,html,small) => `<button type="button" class="tile" data-set="${key}" data-val="${val}" aria-pressed="${String(S[key])===String(val)}">${html}${small?`<small>${small}</small>`:''}</button>`;

function evaluate(){
  const effRain = DISTRICTS[S.district].rain[S.season]*RAIN_FACTOR[S.rain] + (S.irrig==='yes'?300:0) + SOIL[S.soil].rain;
  const vals = SOIL[S.soil];
  return Object.entries(CROPS).filter(([,c])=>c.s===S.season).map(([id,c])=>{
    const f = {
      rain:fit(effRain,c.rain[0],c.rain[1],c.rain[0]*.6,c.rain[1]*.5),
      pH:fit(vals.pH,c.ph[0],c.ph[1],1.2,1.2),
      N:fit(vals.N,c.n[0],c.n[1],c.n[0]*.6,c.n[1]*.6),
      P:fit(vals.P,c.p[0],c.p[1],c.p[0]*.6,c.p[1]*.6),
      K:fit(vals.K,c.k[0],c.k[1],c.k[0]*.6,c.k[1]*.6)
    };
    const score = Math.round(100*(f.rain*.30+f.pH*.20+f.N*.20+f.P*.15+f.K*.15));
    const factor = Math.min(1.15,0.5+0.6*score/100);
    const exp = c.yld*factor*S.acres;
    const spread = 0.12+(1-score/100)*0.3;
    const pess = exp*(1-spread), opt = exp*(1+spread*0.7);
    const costTotal = c.cost*S.acres;
    const n = q => q*c.price-costTotal;
    const fixes = [];
    [['N',c.n],['P',c.p],['K',c.k],['pH',c.ph]].forEach(([k,r])=>{
      if(f[k]<0.9 && S.soil!=='dk') fixes.push({sev:f[k],key:'fix'+k+'_'+(vals[k]<r[0]?'low':'high')});
    });
    fixes.sort((a,b)=>a.sev-b.sev);
    return {id,c,score,exp,pess,opt,costTotal,nPess:n(pess),nExp:n(exp),nOpt:n(opt),fixes,needWater:effRain<c.water};
  }).sort((a,b)=>b.score-a.score || b.nExp-a.nExp).slice(0,3);
}

function buildMsg(lang,picks){
  const L=T[lang], top=picks[0];
  const d = lang==='kn' ? DISTRICTS[S.district].loc : DISTRICTS[S.district].en;
  let m = L.msgHead(S.acres,d,CROPS[top.id][lang],num(top.exp),L.profitWord(top.nExp));
  const rest = picks.slice(1).map(r=>CROPS[r.id][lang]).join(', ');
  if(rest) m += ' '+L.msgOther(rest);
  if(top.fixes[0]) m += ' '+L.msgFix(L[top.fixes[0].key]);
  return m;
}

/* ---------- RENDER ---------- */
function progress(){
  const dots=[1,2,3].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join('');
  return `<div class="progress"><div class="dots" aria-hidden="true">${dots}</div><span>${t('step').replace('{a}',S.step).replace('{b}',3)}</span></div>`;
}

function viewWelcome(){
  return `<h1 class="big">${t('title')}</h1>
  <p class="lead">${t('intro')}</p>
  <p class="q">${T.kn.pickLang} · ${T.en.pickLang}</p>
  <div class="tiles two">
    <button type="button" class="btn main" data-lang-go="kn" style="min-height:76px;font-size:1.5rem">ಕನ್ನಡ</button>
    <button type="button" class="btn main" data-lang-go="en" style="min-height:76px;font-size:1.5rem">English</button>
  </div>
  <p class="note">${T.kn.free} · ${T.en.free}</p>`;
}

function viewLand(){
  const d = Object.entries(DISTRICTS).map(([id,x])=>tile('district',id,`<span>${x[S.lang]}</span>`)).join('');
  return `${progress()}<h2 class="step">${t('s1')}</h2>
  <p class="q">${t('qDistrict')}</p><div class="tiles two">${d}</div>
  <p class="q">${t('qSeason')}</p><div class="tiles two">
    ${tile('season','kharif',`<span class="em">🌧️</span><span>${t('kharif')}</span>`,t('kharifS'))}
    ${tile('season','rabi',`<span class="em">❄️</span><span>${t('rabi')}</span>`,t('rabiS'))}
  </div>
  <p class="q">${t('qAcres')}</p>
  <div class="stepper"><button type="button" data-act="minus" aria-label="−">−</button><output aria-live="polite">${S.acres} <small>${t('acres')}</small></output><button type="button" data-act="plus" aria-label="+">+</button></div>
  ${nav(false)}`;
}

function viewWater(){
  return `${progress()}<h2 class="step">${t('s2')}</h2>
  <p class="q">${t('qRain')}</p><div class="tiles">
    ${tile('rain','less',`<span class="em">🌤️</span><span>${t('rLess')}</span>`)}
    ${tile('rain','normal',`<span class="em">🌦️</span><span>${t('rNormal')}</span>`)}
    ${tile('rain','more',`<span class="em">🌧️</span><span>${t('rMore')}</span>`)}
  </div>
  <p class="q">${t('qIrrig')}</p><div class="tiles two">
    ${tile('irrig','yes',`<span class="em">💧</span><span>${t('yes')}</span>`)}
    ${tile('irrig','no',`<span class="em">🚫</span><span>${t('no')}</span>`)}
  </div>
  ${nav(false)}`;
}

function viewSoil(){
  return `${progress()}<h2 class="step">${t('s3')}</h2>
  <p class="q">${t('qSoil')}</p><div class="tiles two">
    ${tile('soil','black',`<span class="em">⚫</span><span>${t('soilBlack')}</span>`,t('soilBlackS'))}
    ${tile('soil','red',`<span class="em">🔴</span><span>${t('soilRed')}</span>`,t('soilRedS'))}
    ${tile('soil','sandy',`<span class="em">🟡</span><span>${t('soilSandy')}</span>`,t('soilSandyS'))}
    ${tile('soil','dk',`<span class="em">❓</span><span>${t('dk')}</span>`,t('dkS'))}
  </div>
  ${nav(true)}`;
}

function nav(last){
  return `<div class="nav"><button type="button" class="btn" data-act="back">${t('back')}</button><button type="button" class="btn main" data-act="next">${last?t('show'):t('next')}</button></div>`;
}

function viewResult(){
  const picks = evaluate(); window.__picks = picks;
  const top = picks[0];
  const dots = n=>{const on=Math.max(1,Math.ceil(n/20));return `<span class="match" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=on?'on':''}"></i>`).join('')}</span>`;};
  const word = top.score>=75?t('mGood'):top.score>=55?t('mFair'):t('mWeak');
  const pf = n => n>=0 ? `<span class="profit">${t('profit')} ${inr(n)}</span>` : `<span class="loss">${t('loss')} ${inr(Math.abs(n))}</span>`;
  const yr = (cls,label,q,n)=>`<div class="year ${cls}"><div class="lb">${label}</div><div class="qt">${num(q)}</div><div class="lb">${t('quintal')}</div><div class="pf">${pf(n)}</div></div>`;
  const other = picks.slice(1).map(r=>`<div class="other"><span class="em">${r.c.em}</span><div><b>${r.c[S.lang]}</b><span>${t('normalProfit')}: ${inr(r.nExp)}</span></div></div>`).join('');
  const todo = top.fixes.length ? top.fixes.slice(0,3).map(f=>`<li>${t(f.key)}</li>`).join('') : `<li>${t('todoNone')}</li>`;
  const wa = 'https://wa.me/?text='+encodeURIComponent(buildMsg(S.lang,picks));
  const other_l = S.lang==='en'?'kn':'en';
  return `${top.score<40?`<div class="warn">${t('weak')}</div>`:''}
  <section class="best">
    <p class="tag">${t('best')} · ${t('forLand').replace('{a}',S.acres).replace('{d}',DISTRICTS[S.district][S.lang])}</p>
    <div class="name"><span class="em">${top.c.em}</span><div><h2>${top.c[S.lang]}</h2><p class="alt">${top.c[other_l]}</p></div></div>
    <div class="match">${dots(top.score)}<span>${t('match')}: ${word}</span></div>
    <h3 class="sectitle">${t('howMuch')}</h3>
    <div class="years">${yr('',t('poor'),top.pess,top.nPess)}${yr('mid',t('normal'),top.exp,top.nExp)}${yr('',t('goodY'),top.opt,top.nOpt)}</div>
    <ul class="rows" style="margin-top:18px">
      <li><span>${t('cost')}</span><b>${t('costVal').replace('{n}',inr(top.costTotal))}</b></li>
      <li><span>${t('water')}</span><b>${top.needWater?t('waterNeed'):t('waterOk')}</b></li>
    </ul>
    <h3 class="sectitle">${t('todo')}</h3>
    <ul class="todo">${todo}</ul>
  </section>
  <h3 class="sectitle">${t('others')}</h3>${other}
  <div class="actions">
    <button type="button" class="btn main" data-act="listen">${t('listen')}</button>
    <a class="btn wa" href="${wa}" target="_blank" rel="noopener">${t('wa')}</a>
    <button type="button" class="btn" data-act="edit">${t('edit')}</button>
    <button type="button" class="btn" data-act="again">${t('again')}</button>
  </div>
  <p class="note" id="voice-note" aria-live="polite"></p>
  <p class="fine">${t('fine')}</p>`;
}

function render(focusSel){
  document.documentElement.lang = S.lang;
  $('#brand').textContent = t('brand');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  $('#app').innerHTML = [viewWelcome,viewLand,viewWater,viewSoil,viewResult][S.step]();
  if(focusSel){ const f=$('#app').querySelector(focusSel); if(f) f.focus({preventScroll:true}); }
}
function go(n){ S.step=n; render(); window.scrollTo(0,0); }

/* ---------- EVENTS ---------- */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{ S.lang=b.dataset.lang; render(); }));
$('#app').addEventListener('click',e=>{
  const el = e.target.closest('button,a'); if(!el) return;
  if(el.dataset.langGo){ S.lang=el.dataset.langGo; go(1); return; }
  if(el.dataset.set){
    S[el.dataset.set]=el.dataset.val;
    render(`[data-set="${el.dataset.set}"][data-val="${el.dataset.val}"]`); return;
  }
  const a = el.dataset.act; if(!a) return;
  if(a==='plus'){ S.acres=Math.min(50,S.acres+0.5); render('[data-act="plus"]'); }
  else if(a==='minus'){ S.acres=Math.max(0.5,S.acres-0.5); render('[data-act="minus"]'); }
  else if(a==='next') go(S.step+1);
  else if(a==='back') go(Math.max(0,S.step-1));
  else if(a==='edit') go(3);
  else if(a==='again') go(0);
  else if(a==='listen') speak();
});

function speak(){
  const note=$('#voice-note');
  if(!window.speechSynthesis){ note.textContent=S.lang==='kn'?t('noVoice'):''; return; }
  const want = S.lang==='kn'?'kn':'en';
  const v = speechSynthesis.getVoices().find(x=>x.lang && x.lang.toLowerCase().startsWith(want));
  if(S.lang==='kn' && !v){ note.textContent=t('noVoice'); return; }
  const u = new SpeechSynthesisUtterance(buildMsg(S.lang,window.__picks));
  u.lang = S.lang==='kn'?'kn-IN':'en-IN'; if(v) u.voice=v;
  u.onend=()=>{ note.textContent=''; };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  note.textContent=t('playing');
}
if(window.speechSynthesis) speechSynthesis.getVoices();

render();
</script>
</body>
</html>
